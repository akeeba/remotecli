; The fixture answers in JSON. Anything PHP prints of its own accord lands in the middle of that JSON, which is a
; failure mode the suite arms deliberately through control.php rather than suffering by accident.
display_errors = Off
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

; A backup archive part is a few hundred kilobytes here, but downloads are streamed and must not be buffered whole.
output_buffering = Off
