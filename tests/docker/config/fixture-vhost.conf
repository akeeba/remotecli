# The fixture's virtual host.
#
# Two things here matter. AcceptPathInfo is what lets /api/index.php/v3/akeebabackup/getVersion reach index.php with
# the rest of the route in PATH_INFO, which is how Joomla's API application is addressed. The rewrite below is the
# other way that application can be reached, /api/v3/..., which only works on a server with URL rewriting — which is
# exactly why Remote CLI tries the unrewritten form first.

<VirtualHost *:80>
	DocumentRoot /var/www/html

	<Directory /var/www/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted

		AcceptPathInfo On
	</Directory>

	<Directory /var/www/html/api>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted

		AcceptPathInfo On

		RewriteEngine On
		RewriteBase /api/
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteRule ^(.*)$ index.php/$1 [L]
	</Directory>

	ErrorLog /dev/stderr
	CustomLog /dev/stdout combined
</VirtualHost>
